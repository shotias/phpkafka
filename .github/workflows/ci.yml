name: Native PHP checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: native-php-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native PHP 8.4 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NATIVE_PHP_IMAGE: php:8.4.25-cli-bookworm@sha256:d0379b413e257a77de0882e4c43ed0eca154d1c88be566f240f9fe359671f2bf
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Pull pinned native PHP interpreter
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$NATIVE_PHP_IMAGE"
          docker image inspect --format '{{.Id}}' "$NATIVE_PHP_IMAGE"
          git rev-parse HEAD

      - name: Lint PHP and run standalone native regressions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none --read-only \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/source,readonly" \
            --workdir /source --entrypoint bash "$NATIVE_PHP_IMAGE" -euo pipefail -c '
              php -r '\''if (PHP_VERSION !== "8.4.25") { exit(1); } echo PHP_VERSION, PHP_EOL;'\''
              find src tests -type f -name "*.php" -print0 | xargs -0 -r -n 1 php -l
              php tests/native_crc32c.php
              php tests/confirmed_outcomes.php
            '

      - name: Record check scope
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            'This job runs PHP syntax checks and standalone native CRC32C/confirmed-outcome regressions.' \
            'It does not install Composer dependencies or run inherited PHPUnit, formatter, PHPStan, Swoole, or real-broker integration suites.' \
            'Consult preceding steps for the actual pass/fail result.' >> "$GITHUB_STEP_SUMMARY"
